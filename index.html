<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حفل خطوبة نور سليمان & مريم عاطف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

  <!-- Confetti Animation Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Alexandria', sans-serif;
      background-color: #EFECE6;
      background-image: radial-gradient(#dfd9cf 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    .card-shadow {
      box-shadow: 
        0 25px 50px -12px rgba(80, 60, 35, 0.22),
        0 0 0 1px rgba(212, 175, 55, 0.35),
        0 0 25px rgba(212, 175, 55, 0.15);
    }

    .gold-btn {
      background: linear-gradient(135deg, #C59A3F 0%, #AA771C 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gold-btn:hover {
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(170, 119, 28, 0.3);
    }

    .gold-outline-btn {
      border: 1px solid rgba(197, 154, 63, 0.6);
      background: rgba(255, 255, 255, 0.85);
      transition: all 0.25s ease;
    }
    .gold-outline-btn:hover {
      background: rgba(212, 175, 55, 0.12);
      border-color: #AA771C;
      transform: translateY(-1px);
    }

    /* Pulse animation for the open envelope button */
    @keyframes pulse-gold {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
      50% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
    }
    .pulse-gold-btn {
      animation: pulse-gold 2s infinite;
    }
  </style>
</head>

<body class="min-h-screen text-[#4A3E31] flex flex-col items-center justify-center p-3 sm:p-6 selection:bg-[#F8E7A2]">

  <!-- "Tap to Open" Luxury Entrance Screen (Guarantees Music Plays) -->
  <div id="entranceModal" class="fixed inset-0 z-[100] bg-[#FAF7F2] flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
    <div class="max-w-xs w-full bg-white/90 border border-[#D4AF37]/50 rounded-3xl p-8 shadow-2xl space-y-6">
      <div class="w-16 h-16 mx-auto rounded-full bg-amber-50 border border-amber-300/60 flex items-center justify-center text-3xl">
        💌
      </div>
      <div class="space-y-1">
        <p class="text-xs tracking-widest text-[#8C651E] font-semibold">دعوة حفل خطوبة</p>
        <h2 class="text-2xl font-bold text-stone-800" style="font-family: 'Amiri', serif;">نور سليمان & مريم عاطف</h2>
      </div>
      <p class="text-xs text-stone-400">يسعدنا حضوركم ومشاركتنا فرحتنا</p>
      
      <button onclick="openInvitation()" class="w-full gold-btn pulse-gold-btn text-white py-3.5 px-6 rounded-2xl text-sm font-semibold flex items-center justify-center gap-2 shadow-lg">
        <span>افتح الدعوة</span>
        <span>✨</span>
      </button>
    </div>
  </div>

  <!-- Background Music Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Floating Audio Controller Button -->
  <button id="musicToggle" onclick="toggleMusic()" aria-label="تشغيل الموسيقى" class="fixed top-4 left-4 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border border-[#D4AF37]/60 text-[#8C651E] p-3.5 rounded-full shadow-lg hover:scale-110 active:scale-95 transition-all flex items-center justify-center">
    <svg id="musicIcon" class="w-5 h-5 fill-current animate-pulse" viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <span id="muteSlash" class="hidden text-xs font-bold ml-1 text-stone-400">✕</span>
  </button>

  <!-- Main Invitation Mobile Container -->
  <main class="w-full max-w-[430px] flex flex-col items-center space-y-4">

    <!-- The Invitation Card Graphic -->
    <div class="w-full rounded-3xl overflow-hidden card-shadow bg-[#FDFBF7] relative border border-[#D4AF37]/30">
      <img src="card.jpeg" 
           onerror="this.onerror=null; this.src='card.png';" 
           alt="دعوة حفل خطوبة نور سليمان ومريم عاطف" 
           class="w-full h-auto block select-none pointer-events-none">
    </div>

    <!-- Interactive Features & Action Panel -->
    <div class="w-full bg-[#FAF7F2]/95 backdrop-blur-md rounded-2xl p-5 border border-[#D4AF37]/40 shadow-md space-y-4 text-center">

      <!-- Live Countdown Timer (Left-to-Right: Days -> Hours -> Minutes -> Seconds) -->
      <div class="space-y-1.5">
        <p class="text-[11px] font-semibold text-[#8C651E] tracking-wider uppercase">العد التنازلي لموعد الحفل</p>
        <div class="grid grid-cols-4 gap-2 text-center text-stone-700" id="countdown" dir="ltr">
          <div class="bg-white/80 p-2 rounded-xl border border-amber-200/50 shadow-xs">
            <span id="days" class="block font-bold text-lg text-[#AA771C]">00</span>
            <span class="text-[10px] text-stone-400">يوم</span>
          </div>
          <div class="bg-white/80 p-2 rounded-xl border border-amber-200/50 shadow-xs">
            <span id="hours" class="block font-bold text-lg text-[#AA771C]">00</span>
            <span class="text-[10px] text-stone-400">ساعة</span>
          </div>
          <div class="bg-white/80 p-2 rounded-xl border border-amber-200/50 shadow-xs">
            <span id="minutes" class="block font-bold text-lg text-[#AA771C]">00</span>
            <span class="text-[10px] text-stone-400">دقيقة</span>
          </div>
          <div class="bg-white/80 p-2 rounded-xl border border-amber-200/50 shadow-xs">
            <span id="seconds" class="block font-bold text-lg text-[#AA771C]">00</span>
            <span class="text-[10px] text-stone-400">ثانية</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-2 pt-1">
        <!-- Add to Calendar -->
        <button onclick="addToCalendar()" class="w-full gold-btn text-white py-3.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-md">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/>
          </svg>
          <span>إضافة الموعد إلى تقويم الهاتف</span>
        </button>

        <!-- Google Maps Location -->
        <a href="https://maps.app.goo.gl/CEvD2EJZVckCW9ax7" target="_blank" rel="noopener noreferrer" class="w-full gold-outline-btn text-[#70521C] py-3.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-xs">
          <svg class="w-4 h-4 text-[#AA771C] fill-current" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span>موقع القاعة: قاعة كيان — سيدي جابر (Google Maps)</span>
        </a>
      </div>

      <!-- WhatsApp Congratulations -->
      <div class="pt-3 border-t border-[#D4AF37]/30">
        <p class="text-[11px] text-stone-500 mb-2.5 font-medium">شاركونا الفرحة برسالة طيبة عبر واتساب</p>
        <div class="grid grid-cols-2 gap-2.5">
          <a href="https://wa.me/201553628839?text=%D8%A3%D9%84%D9%81%20%D9%85%D8%A8%D8%B1%D9%88%D9%83%20%D8%A7%D9%84%D8%AE%D8%B7%D9%88%D8%A8%D8%A9%20%D9%8A%D8%A7%20%D9%86%D9%88%D8%B1%D8%8C%20%D8%B1%D8%A8%D9%86%D8%A7%20%D9%8A%D8%AA%D9%85%D9%85%D9%84%D9%83%D9%85%20%D8%B9%D9%84%D9%89%20%D8%AE%D9%8A%D8%B1%20%D9%88%D9%8A%D8%B3%D8%B9%D8%AF%D9%83%D9%85!" target="_blank" rel="noopener noreferrer" class="gold-outline-btn text-[#2D6A4F] py-2.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs">
            <span>تهنئة نور</span>
            <span>💬</span>
          </a>
          <a href="https://wa.me/201226708121?text=%D8%A3%D9%84%D9%81%20%D9%85%D8%A8%D8%B1%D9%88%D9%83%20%D8%A7%D9%84%D8%AE%D8%B7%D9%88%D8%A8%D8%A9%20%D9%8A%D8%A7%20%D9%85%D8%B1%D9%8A%D9%85%D8%8C%20%D8%B1%D8%A8%D9%86%D8%A7%20%D9%8A%D8%AA%D9%85%D9%85%D9%84%D9%83%D9%85%20%D8%B9%D9%84%D9%89%20%D8%AE%D9%8A%D8%B1%20%D9%88%D9%8A%D8%B3%D8%B9%D8%AF%D9%83%D9%85!" target="_blank" rel="noopener noreferrer" class="gold-outline-btn text-[#2D6A4F] py-2.5 px-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs">
            <span>تهنئة مريم</span>
            <span>💬</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Footer Note -->
    <footer class="text-center text-[11px] text-stone-400 pt-1 pb-4">
      دامت دياركم عامرة بالأفراح والمسرات ✨
    </footer>
  </main>

  <script>
    const audio = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const muteSlash = document.getElementById('muteSlash');
    let isPlaying = false;

    // Called when the guest taps "افتح الدعوة"
    function openInvitation() {
      // 1. Play the music immediately
      audio.play().then(() => {
        isPlaying = true;
        musicIcon.classList.add('animate-pulse');
        muteSlash.classList.add('hidden');
      }).catch(err => {
        console.log("Audio play error:", err);
      });

      // 2. Explode festive gold confetti
      confetti({
        particleCount: 60,
        spread: 80,
        origin: { y: 0.4 },
        colors: ['#D4AF37', '#F8E7A2', '#C59A3F', '#FAF7F2']
      });

      // 3. Smoothly fade out the entrance screen
      const modal = document.getElementById('entranceModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        modal.remove();
      }, 700);
    }

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        musicIcon.classList.remove('animate-pulse');
        muteSlash.classList.remove('hidden');
      } else {
        audio.play().then(() => {
          isPlaying = true;
          musicIcon.classList.add('animate-pulse');
          muteSlash.classList.add('hidden');
        });
      }
    }

    // Live Countdown to September 26, 2026 at 20:00:00 (GMT+3 Egypt Time)
    const targetDate = new Date('2026-09-26T20:00:00+03:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
      } else {
        document.getElementById('countdown').innerHTML = `
          <div class="col-span-4 py-2 font-bold text-[#AA771C]">
            اليوم هو يوم فرحتنا! أهلاً وسهلاً بكم ✨
          </div>
        `;
      }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    function addToCalendar() {
      const title = encodeURIComponent("حفل خطوبة نور سليمان & مريم عاطف");
      const details = encodeURIComponent("يسعدنا حضوركم لمشاركتنا فرحة حفل خطوبة نور ومريم في قاعة كيان بسيدي جابر (بجوار تيفولي دوم الإسكندرية).");
      const location = encodeURIComponent("قاعة كيان، سيدي جابر، الإسكندرية");
      const dates = "20260926T170000Z/20260926T210000Z";
      
      const googleCalendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
      window.open(googleCalendarUrl, '_blank');
    }
  </script>
</body>
</html>
